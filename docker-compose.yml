version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: catalogiq-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CatalogIQ
      - APP_VERSION=1.0.0
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:///./catalogiq.db
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CONFIDENCE_THRESHOLD=0.85
      - LLM_FALLBACK_MODEL=gpt-4o-mini
    volumes:
      - backend-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - catalogiq-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: catalogiq-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - catalogiq-net

volumes:
  backend-data:

networks:
  catalogiq-net:
    driver: bridge
