services:
  # ---------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: catalogiq-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./catalogiq.db
      - key: CORS_ORIGINS
        value: '["*"]'

  # ---------------------------------------------------------------------------
  # Frontend UI (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: catalogiq-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerBuildArgs:
      - key: NEXT_PUBLIC_API_URL
        value: https://catalogiq-backend.onrender.com
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://catalogiq-backend.onrender.com
